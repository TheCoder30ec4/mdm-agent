# Desktop app (contracts/settings.md, "Desktop app"): MDM built from the fork (the misterdownloadmanager/ submodule),
# then a PyInstaller one-folder build of desktop/app.py with it.
# - Run by hand (Actions -> Desktop app -> Run workflow): the zips are kept as the run's artifacts.
# - A pushed tag v*: the same, and the zips are attached to that tag's GitHub Release.
# Unsigned builds: README "Desktop app (Mac and Windows)" says how to open them.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fork's release profile (fat LTO, one codegen unit) is slow and memory-hungry on hosted runners;
  # thin LTO as in the Dockerfile.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  build:
    name: ${{ matrix.zip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # arm64
            zip: MDM-Agent-macos-arm64.zip
          - os: windows-latest
            zip: MDM-Agent-windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust toolchain (misterdownloadmanager/rust-toolchain.toml)
        working-directory: misterdownloadmanager
        run: rustup show active-toolchain || rustup toolchain install

      # BoringSSL and AWS-LC need NASM on x64 Windows; the runner has CMake and LLVM's libclang already
      # (misterdownloadmanager/.github/workflows/release.yml). The C runtime is linked statically by the
      # fork's .cargo/config.toml.
      - name: NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            misterdownloadmanager/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('misterdownloadmanager/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build MDM
        working-directory: misterdownloadmanager
        run: cargo build --locked --release -p mdm-app -p mdm-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt

      # The whole suite on macOS; on Windows the desktop helpers (the rest assumes POSIX file modes).
      - name: Tests
        run: python -m pytest -p no:warnings ${{ runner.os == 'Windows' && 'tests/test_desktop.py' || '' }}

      - name: PyInstaller
        env:
          MDM_BIN_DIR: misterdownloadmanager/target/release
        run: pyinstaller --noconfirm desktop/mdm-agent.spec

      - name: Smoke test and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/MDM Agent.app/Contents/Frameworks/mdm/misterdownloadmanager-cli" --help > /dev/null
          codesign --verify --deep "dist/MDM Agent.app"
          ditto -c -k --keepParent "dist/MDM Agent.app" "${{ matrix.zip }}"

      - name: Smoke test and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/MDM Agent/_internal/mdm/misterdownloadmanager-cli.exe" --help > $null
          if ($LASTEXITCODE) { throw "the bundled MDM CLI did not run" }
          Compress-Archive -Path "dist/MDM Agent" -DestinationPath "${{ matrix.zip }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/*.zip --generate-notes --title "MDM Agent $TAG" --repo "$REPO"
          fi
