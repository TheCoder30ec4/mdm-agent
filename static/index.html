<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Find a file, read its safety verdict, approve the download, then play or save it from your library.">
<title>Download Assistant</title>
<link rel="preload" href="/static/fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<header class="bar">
  <div class="bar__in">
    <button type="button" class="btn" id="menu" aria-expanded="false" aria-controls="side">Menu</button>
    <h1>Download Assistant</h1>
    <div class="bar__end"><button type="button" class="btn" id="signout" hidden>Sign out</button></div>
  </div>
</header>
<p id="banner" role="status" hidden></p>

<div class="shell" id="shell">
  <nav class="side" id="side" aria-label="Library and chats">
    <button type="button" class="btn" id="new-chat">New download</button>
    <a class="side-link" id="nav-library" href="#library">Library <span class="count measured" id="dl-count" aria-label="downloads running"></span></a>
    <h2 id="chats-h">Chats</h2>
    <ul class="chats" id="chat-list" aria-labelledby="chats-h"></ul>
  </nav>

  <div class="view" id="view-chat">
    <main id="thread" tabindex="-1" aria-label="Conversation">
      <div class="chat-head" id="chat-head" hidden><h2 id="chat-title"></h2><div id="chat-tools"></div></div>
      <div id="inner" role="log" aria-live="polite" aria-relevant="additions"></div>
    </main>
    <form id="composer" autocomplete="off">
      <div class="row">
        <label for="input" class="sr">Message</label>
        <textarea id="input" rows="1" maxlength="4000" placeholder="Describe what you want, or paste a link" required aria-describedby="composer-hint"></textarea>
        <button type="submit" class="btn primary" id="send">Send</button>
      </div>
      <p class="hint" id="composer-hint">Describe something or paste a link. You decide what gets downloaded.</p>
    </form>
  </div>

  <section class="view" id="view-library" aria-labelledby="lib-h" hidden>
    <div class="dl">
      <h2 id="lib-h">Library</h2>
      <section class="lib-active" id="lib-active" aria-labelledby="active-h" hidden>
        <h3 id="active-h">Downloading now</h3>
        <div id="dl-region" aria-live="polite"></div>
      </section>
      <div id="lib-region" aria-live="polite"></div>
    </div>
  </section>
</div>

<section class="login" id="login" hidden>
  <form id="login-form" novalidate>
    <h2>Sign in</h2>
    <p>This server asks for its access token: the MDM_TOKEN value in the server’s .env.</p>
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required aria-describedby="login-help">
    <p class="help" id="login-help" aria-live="polite"></p>
    <button type="submit" class="btn primary" id="login-btn">Sign in</button>
  </form>
</section>

<dialog class="player" id="player" aria-labelledby="player-title">
  <div class="player-head"><h2 id="player-title"></h2><button type="button" id="player-close">Close</button></div>
  <video id="player-video" controls playsinline preload="metadata"></video>
  <div class="player-foot">
    <p class="meta" id="player-note"></p>
    <a class="btn" id="player-dl" href="/api/library" download>Download to this computer</a>
    <button type="button" id="player-link">Copy VLC link</button>
    <div class="linkbox" id="linkbox" hidden><label for="link-url" class="sr">Stream link for VLC</label><input id="link-url" readonly></div>
  </div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
// All model/web-derived text goes through el()/textContent; there is no HTML string building anywhere.
const $ = (id) => document.getElementById(id);
const inner = $("inner"), thread = $("thread"), input = $("input"), sendBtn = $("send"), toasts = $("toasts");
const enc = encodeURIComponent;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid); // strings become text nodes
  return e;
}


function fmtBytes(n) {
  if (n == null || isNaN(n)) return "unknown size";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n < 10 ? 2 : 1)) + " " + u[i];
}
const fmtSpeed = (s) => (s ? fmtBytes(s) + "/s" : "");

// ---------- thread ----------
let typing = null, emptyEl = null;
function add(node) {
  if (emptyEl) { emptyEl.remove(); emptyEl = null; }
  if (typing && typing.parentNode) inner.insertBefore(node, typing); else inner.append(node);
  node.scrollIntoView({ block: "end" });
  return node;
}
function showTyping() { typing = el("div", { class: "typing", text: "Working…" }); inner.append(typing); typing.scrollIntoView({ block: "end" }); }
function hideTyping() { if (typing) typing.remove(); typing = null; }

const STEP_LABEL = {
  research: "Researching", web_search: "Searching the web", web_scrape: "Reading a page", inspect_link: "Checking link",
  propose_download: "Preparing a preview", job_status: "Checking download status", list_jobs: "Listing downloads",
};
function stepText(ev) {
  const base = (STEP_LABEL[ev.name] || String(ev.name)) + "…";
  const a = ev.args || {};
  const detail = a.query || a.url || a.job_id || "";
  return { base, detail: detail ? String(detail).slice(0, 120) : "" };
}

function showEmpty() {
  const send = (t) => { input.value = t; sendMessage(); };
  emptyEl = el("div", { class: "empty" },
    el("h2", { text: "What would you like to download?" }),
    el("p", { text: "I search, check links for safety, and show you a preview. Nothing downloads until you press Download." }),
    el("div", { class: "examples" },
      el("button", { type: "button", text: "Find Nosferatu (1922)", "aria-label": "Find a public-domain copy of Nosferatu (1922)", onclick: () => send("Find a public-domain copy of Nosferatu (1922)") }),
      el("button", { type: "button", text: "Paste a link to inspect", onclick: () => { input.value = "Please inspect this link: "; input.focus(); autosize(); } })));
  inner.append(emptyEl);
}

// ---------- cards ----------
const cards = new Map();      // proposal id -> {p, root, foot, footKey, refs}
const jobs = new Map();       // job id -> job
const toasted = new Set();

const BADGE = { ok: "Looks OK", caution: "Caution", risky: "Risky" };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch (e) { /* non-JSON */ }
  if (r.status === 401 && path !== "/api/login") showLogin();
  if (!r.ok) { const err = new Error((data && data.detail && typeof data.detail === "string" ? data.detail : "Request failed (" + r.status + ")")); err.status = r.status; throw err; }
  return data;
}

function buildCard(p) {
  const r = p.report || {}, s = r.safety || {}, level = BADGE[s.level] ? s.level : "caution";
  const title = r.title || r.filename || r.url || "Untitled";
  // The verdict leads: it is what the person decides on.
  const verdict = el("div", { class: "verdict " + level }, el("span", { class: "badge", text: BADGE[level] }));
  if (s.reasons && s.reasons.length) verdict.append(el("ul", { "aria-label": "Safety reasons" }, s.reasons.map((x) => el("li", { text: String(x) }))));

  const facts = el("dl", { class: "facts" });
  const fact = (k, v) => { if (v) facts.append(el("div", {}, el("dt", { text: k }), el("dd", { class: "measured", text: String(v) }))); };
  const chosen = p.files && p.files.length ? new Set(p.files) : null;
  fact("Source", r.host);
  fact("Size", fmtBytes(r.size));
  fact("Type", r.kind === "magnet" ? "torrent" : r.content_type);
  if (r.files && r.files.length) fact("Files", (chosen ? chosen.size + " of " : "") + r.files.length);
  if (r.filename && r.filename !== title) fact("File name", r.filename);

  const info = el("div", { class: "info" }, el("h3", { text: title }), facts, el("div", { class: "path", text: r.url || "" }));
  if (s.skipped && s.skipped.length) info.append(el("div", { class: "meta", text: "Checks that could not run:" }), el("ul", { "aria-label": "Skipped checks" }, s.skipped.map((x) => el("li", { text: String(x) }))));
  if (p.note) info.append(el("p", { class: "note", text: p.note }));
  if (r.files && r.files.length) {
    info.append(el("details", {}, el("summary", { text: "Files (" + (chosen ? chosen.size + " of " : "") + r.files.length + ")" }),
      el("ul", {}, r.files.map((f) => el("li", { text: (chosen ? (chosen.has(f.index) ? "✓ " : "– ") : "") + f.path + " (" + fmtBytes(f.size) + ")" })))));
  }
  info.append(el("p", { class: "fine", text: "Safety checks are heuristics, not a guarantee." }));
  const body = el("div", { class: "body" });
  if (typeof r.image === "string" && r.image.startsWith("https://")) {
    body.append(el("img", { src: r.image, alt: "", width: 112, height: 112, loading: "lazy", referrerpolicy: "no-referrer", onerror: (e) => e.target.remove() }));
  }
  body.append(info);
  return [verdict, body];
}

function ensureCard(p, parent) {
  let c = cards.get(p.id);
  if (c) { c.p = p; return c; }
  const foot = el("div", { class: "foot" });
  const root = el("section", { class: "card", "aria-label": "Download preview: " + ((p.report && (p.report.title || p.report.filename)) || "item") }, buildCard(p), foot);
  c = { p, root, foot, footKey: null, refs: null };
  cards.set(p.id, c);
  if (parent) parent.append(root); else add(root);
  return c;
}

function jobFor(c) { return c.p.job_id ? jobs.get(c.p.job_id) : null; }

async function cancelJob(job, btn, onErr) {
  btn.disabled = true; btn.setAttribute("aria-busy", "true");
  try { applyJob(await api("POST", "/api/jobs/" + encodeURIComponent(job.id) + "/cancel")); }
  catch (e) { btn.disabled = false; onErr(e.message); }
  finally { btn.removeAttribute("aria-busy"); }
}

function renderFoot(c) {
  const p = c.p, job = jobFor(c);
  const key = p.status + ":" + (job ? job.state : "-");
  if (key === c.footKey) { if (job) updateProgress(c, job); return; }
  c.footKey = key; c.refs = null;
  const f = c.foot; f.replaceChildren();
  if (p.status === "pending") {
    const dl = el("button", { type: "button", class: "primary", text: "Download", onclick: () => onDownload(c, dl, skip) });
    const skip = el("button", { type: "button", text: "Skip", onclick: () => onSkip(c, dl, skip) });
    f.append(dl, skip);
  } else if (p.status === "rejected") {
    f.append(el("span", { class: "meta", text: "Skipped." }));
  } else if (!job) {
    f.append(el("span", { class: "meta", text: "Starting download…" }));
  } else if (job.state === "queued" || job.state === "running") {
    const bar = el("progress", { max: 100, "aria-label": "Download progress" });
    const txt = el("span", { class: "measured" });
    const hint = el("span", { class: "slow" });
    const cancel = el("button", { type: "button", text: "Cancel", onclick: () => cancelJob(job, cancel, (m) => f.append(el("span", { class: "errtext", role: "alert", text: m }))) });
    f.append(bar, txt, cancel, hint);
    c.refs = { bar, txt, hint };
    updateProgress(c, job);
  } else if (job.state === "done") {
    f.append(el("span", { class: "meta grow", text: "Download complete." }), pathEl("path grow", "Saved to " + (job.path || "?")));
  } else if (job.state === "error") {
    f.append(el("span", { class: "errtext", role: "alert", text: "Download failed: " + (job.error || "unknown error") }));
  } else {
    f.append(el("span", { class: "meta", text: "Download cancelled." }));
  }
}

// The figures (bytes, speed, time left, connections or peers) and, when the numbers say so, why it is slow.
function progressParts(job) {
  const left = fmtBytes(job.downloaded || 0) + (job.size ? " of " + fmtBytes(job.size) : "");
  const parts = [(job.state === "queued" ? "Queued. " : "") + left];
  if (job.speed) parts.push(fmtSpeed(job.speed));
  const eta = etaText(job);
  if (eta) parts.push(eta);
  const torrent = job.peers != null || job.phase != null;
  const n = (k, one, many) => k + " " + (k === 1 ? one : many);
  if (torrent) parts.push(n(job.peers || 0, "peer", "peers") + " connected" + (job.peers_seen ? ", " + job.peers_seen + " found" : ""));
  else if (job.connections) parts.push(n(job.connections, "connection", "connections"));
  return { figures: parts.join(", "), hint: slowHint(job, torrent) };
}
function setBar(bar, job) {
  if (job.size) { bar.max = job.size; bar.value = job.downloaded || 0; } else { bar.removeAttribute("value"); }
}

function updateProgress(c, job) {
  if (!c.refs) return;
  const { bar, txt, hint } = c.refs;
  setBar(bar, job);
  const p = progressParts(job);
  txt.textContent = p.figures; hint.textContent = p.hint; hint.hidden = !p.hint;
}

// Time left from the current speed; hidden until both size and speed are known.
function etaText(job) {
  if (job.state !== "running" || !job.size || !job.speed) return "";
  const s = Math.max(0, (job.size - (job.downloaded || 0)) / job.speed);
  if (s < 60) return Math.ceil(s) + " s left";
  if (s < 3600) return Math.round(s / 60) + " min left";
  return Math.floor(s / 3600) + " h " + Math.round((s % 3600) / 60) + " min left";
}

// Why it is slow, in plain words, when MDM's numbers say so.
function slowHint(job, torrent) {
  if (job.state !== "running" || job.speed) return "";
  if (torrent) return job.peers ? "Connected to peers, waiting for data." :
    "Waiting for peers: few or no people are sharing this torrent right now, so it can't go faster.";
  return job.downloaded ? "Stalled: the server stopped sending data (it may be limiting or blocking this connection)."
    : "Connecting to the server…";
}

function footError(c, msg) {
  c.foot.querySelectorAll(".errtext").forEach((n) => n.remove());
  c.foot.append(el("span", { class: "errtext", role: "alert", text: msg }));
}

function onDownload(c, dl, skip) {
  if (c.p.report && c.p.report.safety && c.p.report.safety.level === "risky") return askRisky(c, dl, skip);
  return doApprove(c, false, dl, skip);
}

function askRisky(c, dl, skip) {
  if (c.foot.querySelector(".confirm")) return;
  dl.disabled = skip.disabled = true;
  const no = el("button", { type: "button", text: "Cancel" });
  const yes = el("button", { type: "button", class: "danger", text: "Yes, download anyway" });
  const box = el("div", { class: "confirm", role: "group", "aria-label": "Confirm risky download" },
    el("p", { text: "This looks risky. Download anyway?" }), el("div", { class: "row" }, no, yes));
  const close = () => { box.remove(); dl.disabled = skip.disabled = false; dl.focus(); };
  no.addEventListener("click", close);
  box.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  yes.addEventListener("click", () => { yes.disabled = no.disabled = true; doApprove(c, true, dl, skip, box); });
  c.foot.append(box);
  no.focus();
}

async function doApprove(c, confirmRisky, dl, skip, box) {
  dl.disabled = skip.disabled = true;
  try {
    const job = await api("POST", "/api/proposals/" + encodeURIComponent(c.p.id) + "/approve", { confirm_risky: confirmRisky });
    c.p = Object.assign({}, c.p, { status: "approved", job_id: job.id });
    applyJob(job);
  } catch (e) {
    if (box) box.remove();
    dl.disabled = skip.disabled = false;
    if (e.status === 409 && e.message === "needs_confirm") return askRisky(c, dl, skip);
    footError(c, e.message);
  }
}

async function onSkip(c, dl, skip) {
  dl.disabled = skip.disabled = true;
  try { applyProposal(await api("POST", "/api/proposals/" + encodeURIComponent(c.p.id) + "/reject")); }
  catch (e) { dl.disabled = skip.disabled = false; footError(c, e.message); }
}


// ---------- library: finished downloads, with posters ----------
const items = new Map();      // item id -> item
const proposals = new Map();  // proposal id -> proposal
const itemNodes = new Map();  // item id -> {li, key}
let libState = "loading";
const libRegion = $("lib-region");
const KIND_WORD = { video: "Video", audio: "Audio", image: "Image", document: "Document", archive: "Archive", other: "File" };

function mainFile(it) { return (it.files || [])[it.main || 0] || {}; }
function extOf(path) { const m = /\.([A-Za-z0-9]{1,6})$/.exec(path || ""); return m ? m[1].toLowerCase() : ""; }

function renderLibrary() {
  updateCount(); renderActive();
  if (libState === "loading") {
    if (libRegion.dataset.state === "loading") return;
    libRegion.dataset.state = "loading";
    libRegion.replaceChildren(el("ul", { class: "lib-grid", "aria-busy": "true", "aria-label": "Loading the library" },
      [0, 1, 2, 3].map(() => el("li", {}, el("div", { class: "skel-poster" })))));
    return;
  }
  if (libState === "error" && !items.size) {
    if (libRegion.dataset.state === "error") return;
    libRegion.dataset.state = "error";
    libRegion.replaceChildren(el("div", { class: "dl-empty" },
      el("p", { class: "errtext", role: "alert", text: "Could not load the library. The server may still be starting." }),
      el("button", { type: "button", class: "btn", text: "Try again", onclick: () => { libState = "loading"; renderLibrary(); start(); } })));
    return;
  }
  if (!items.size) {
    if (libRegion.dataset.state === "empty") return;
    libRegion.dataset.state = "empty";
    libRegion.replaceChildren(el("div", { class: "dl-empty" },
      el("p", { text: "Nothing here yet. Finished downloads land in the library with a poster, ready to play here or save to this computer." }),
      el("button", { type: "button", class: "btn", text: "New download", onclick: newChat })));
    return;
  }
  let grid = libRegion.querySelector(".lib-grid:not([aria-busy])");
  if (!grid) { libRegion.dataset.state = "full"; grid = el("ul", { class: "lib-grid", "aria-label": "Downloaded files" }); libRegion.replaceChildren(grid); itemNodes.clear(); }
  const sorted = [...items.values()].sort((a, b) => String(b.created).localeCompare(String(a.created)));
  for (const [id, n] of itemNodes) if (!items.has(id)) { n.li.remove(); itemNodes.delete(id); }
  sorted.forEach((it, i) => {
    const key = [it.title, it.poster, it.size, (it.files || []).length].join("|");
    let n = itemNodes.get(it.id);
    if (!n || n.key !== key) { const li = itemNode(it); if (n) n.li.replaceWith(li); n = { li, key }; itemNodes.set(it.id, n); }
    if (grid.children[i] !== n.li) grid.insertBefore(n.li, grid.children[i] || null);
  });
}

function itemNode(it) {
  const f = mainFile(it), ext = extOf(f.path), base = "/api/library/" + enc(it.id);
  const face = it.poster
    ? el("img", { src: base + "/poster", alt: "", loading: "lazy", width: 400, height: 600, onerror: (e) => e.target.remove() })
    : el("span", { class: "kind" }, KIND_WORD[it.kind] || "File", ext ? el("small", { text: "." + ext }) : null);
  const poster = el("button", { type: "button", class: "poster", "aria-label": (f.playable ? "Play " : "Open ") + it.title, onclick: () => openPlayer(it) }, face);
  const actions = el("div", { class: "actions" },
    f.playable ? el("button", { type: "button", text: "Play", onclick: () => openPlayer(it) }) : el("button", { type: "button", text: "Open", onclick: () => openPlayer(it) }),
    el("a", { class: "btn", href: base + "/download?file=" + (it.main || 0), download: "", text: "Save" }));
  const del = el("button", { type: "button", text: "Delete", onclick: () => confirmDelete(it, actions, del) });
  actions.append(del);
  const meta = [fmtBytes(it.size)]; if (ext) meta.push(ext); if ((it.files || []).length > 1) meta.push(it.files.length + " files");
  return el("li", { class: "item" }, poster, el("h3", { text: it.title || f.path || "Untitled" }), el("p", { class: "meta measured", text: meta.join(", ") }), actions);
}

function confirmDelete(it, actions, del) {
  if (actions.parentNode.querySelector(".confirm")) return;
  del.disabled = true;
  const no = el("button", { type: "button", text: "Keep" });
  const yes = el("button", { type: "button", class: "danger", text: "Delete file" });
  const box = el("div", { class: "confirm", role: "group", "aria-label": "Confirm delete" },
    el("p", { text: "Delete " + (it.title || "this download") + " from this computer?" }), el("div", { class: "row" }, no, yes));
  const close = () => { box.remove(); del.disabled = false; del.focus(); };
  no.addEventListener("click", close);
  box.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  yes.addEventListener("click", async () => {
    yes.disabled = no.disabled = true;
    try { await api("DELETE", "/api/library/" + enc(it.id)); items.delete(it.id); renderLibrary(); }
    catch (e) { yes.disabled = no.disabled = false; box.append(el("span", { class: "errtext", role: "alert", text: e.message })); }
  });
  actions.after(box); no.focus();
}

function applyItem(it) { if (!it || !it.id) return; items.set(it.id, it); renderLibrary(); }

// ---------- player ----------
const player = $("player"), video = $("player-video");
let playing = null;
function openPlayer(it) {
  const f = mainFile(it), idx = it.main || 0, base = "/api/library/" + enc(it.id);
  playing = { it, idx };
  $("player-title").textContent = it.title || f.path || "Untitled";
  $("player-dl").href = base + "/download?file=" + idx;
  $("linkbox").hidden = true; $("player-link").textContent = "Copy VLC link";
  video.hidden = !f.playable;
  if (f.playable) {
    if (it.poster) video.poster = base + "/poster"; else video.removeAttribute("poster");
    video.src = base + "/stream?file=" + idx;
    $("player-note").textContent = "";
  } else {
    video.removeAttribute("src");
    $("player-note").textContent = "Browsers can't play " + (extOf(f.path) ? "." + extOf(f.path) + " files" : "this file") + ". Copy the link into VLC (File, Open Network) or save it.";
  }
  player.showModal();
  if (f.playable) video.play().catch(() => {});
}
function closePlayer() { video.pause(); video.removeAttribute("src"); video.load(); playing = null; }
$("player-close").addEventListener("click", () => player.close());
player.addEventListener("close", closePlayer);

// ---------- chats: New download starts one; earlier ones in the sidebar ----------
const chatsMap = new Map();
let currentChat = null, route = "chat", openSeq = 0;

function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toDateString() === new Date().toDateString()
    ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function renderChatList() {
  const list = $("chat-list");
  const sorted = [...chatsMap.values()].sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  if (!sorted.length) { list.replaceChildren(el("li", { class: "chats-empty", text: "No chats yet." })); return; }
  list.replaceChildren(...sorted.map((c) => el("li", {}, el("a", { href: "#chat/" + enc(c.id), "aria-current": route === "chat" && c.id === currentChat ? "page" : null },
    el("span", { text: c.title || "New download" }), el("time", { datetime: c.updated, text: when(c.updated) })))));
  if (route === "library") $("nav-library").setAttribute("aria-current", "page"); else $("nav-library").removeAttribute("aria-current");
}

function setHead(chat) {
  const head = $("chat-head"), tools = $("chat-tools");
  head.hidden = !chat; tools.replaceChildren();
  if (!chat) return;
  $("chat-title").textContent = chat.title || "New download";
  const del = el("button", { type: "button", class: "btn", text: "Delete chat" });
  del.addEventListener("click", () => {
    del.hidden = true;
    const no = el("button", { type: "button", class: "btn", text: "Keep" });
    const yes = el("button", { type: "button", class: "btn", text: "Delete chat" });
    const box = el("div", { class: "examples", role: "group", "aria-label": "Confirm delete chat" }, el("span", { class: "meta", text: "Delete this chat? Its downloads stay in the library." }), no, yes);
    no.addEventListener("click", () => { box.remove(); del.hidden = false; del.focus(); });
    yes.addEventListener("click", async () => {
      yes.disabled = no.disabled = true;
      try { await api("DELETE", "/api/chats/" + enc(chat.id)); chatsMap.delete(chat.id); renderChatList(); newChat(); }
      catch (e) { yes.disabled = no.disabled = false; box.append(el("span", { class: "errtext", role: "alert", text: e.message })); }
    });
    tools.append(box); no.focus();

}

async function openChat(id) {
  const seq = ++openSeq;
  currentChat = id; cards.clear(); emptyEl = null; typing = null; earlier = null;
  inner.replaceChildren(); renderChatList();
  if (!id) { setHead(null); showEmpty(); return; }
  setHead(chatsMap.get(id) || { id, title: "Loading…" });
  inner.append(el("div", { class: "typing", text: "Loading this chat…" }));
  try {
    const d = await api("GET", "/api/chats/" + enc(id));
    if (seq !== openSeq) return;
    chatsMap.set(id, d.chat); setHead(d.chat); renderChatList();
    inner.replaceChildren();
    for (const ev of d.events || []) {
      if (ev.type === "user") inner.append(el("div", { class: "msg user", text: String(ev.text || "") }));
      else if (ev.type === "proposal") { const p = proposals.get(ev.id); if (p) { const c = ensureCard(p, inner); renderFoot(c); } }
      else onChatEvent(ev);
    }
    if (!inner.children.length) showEmpty();
    thread.scrollTop = thread.scrollHeight;
  } catch (e) {
    if (seq !== openSeq) return;
    inner.replaceChildren(el("div", { class: "msg err", role: "alert", text: e.status === 404 ? "This chat no longer exists." : "Could not load this chat: " + e.message }));
  }
}

// ---------- downloading now (in the library) ----------
const dlRegion = $("dl-region"), dlCount = $("dl-count");
const dlRows = new Map();     // job id -> {tr, key, refs}
let dlTbody = null;
const STATE_WORD = { queued: "Queued", running: "Downloading", done: "Done", error: "Failed", cancelled: "Cancelled" };
const COLS = ["File", "State", "Progress", "Note", ""];
const isLive = (j) => j.state === "queued" || j.state === "running";

function jobName(j) {
  const p = proposals.get(j.proposal_id), r = p && p.report;
  return j.title || (r && (r.title || r.filename)) || j.url || "Download";
}
function updateCount() { const n = [...jobs.values()].filter(isLive).length; dlCount.textContent = n ? String(n) : ""; }

function renderActive() {
  // running and queued jobs, plus failures from the last day, so a failed download is not silently lost
  const dayAgo = Date.now() - 864e5;
  const list = [...jobs.values()].filter((j) => isLive(j) || (j.state === "error" && Date.parse(j.finished || j.created) > dayAgo))
    .sort((a, b) => String(b.created).localeCompare(String(a.created)));
  $("lib-active").hidden = !list.length;
  if (!list.length) { dlRegion.replaceChildren(); dlTbody = null; dlRows.clear(); return; }
  if (!dlTbody) {
    dlTbody = el("tbody"); dlRows.clear();
    dlRegion.replaceChildren(el("table", { class: "dl-table" },
      el("thead", {}, el("tr", {}, COLS.map((h) => el("th", { scope: "col" }, h ? h : el("span", { class: "sr", text: "Actions" }))))), dlTbody));
  }
  const keep = new Set(list.map((j) => j.id));
  for (const [id, row] of dlRows) if (!keep.has(id)) { row.tr.remove(); dlRows.delete(id); }
  list.forEach((j, i) => { const row = dlRow(j); if (dlTbody.children[i] !== row.tr) dlTbody.insertBefore(row.tr, dlTbody.children[i] || null); });
}


function dlRow(j) {
  let row = dlRows.get(j.id);
  const key = j.state;
  if (!row) { row = { tr: el("tr"), key: null, refs: null }; dlRows.set(j.id, row); }
  if (row.key !== key) {
    row.key = key; row.refs = null;
    const live = j.state === "queued" || j.state === "running";
    const td = (label, ...kids) => el("td", { "data-label": label }, el("div", { class: "cell" }, ...kids));
    const prog = el("div", { class: "dl-prog" });
    const msg = el("div", { class: "dl-saved" });
    const act = [];
    if (live) {
      const bar = el("progress", { max: 100, "aria-label": "Progress of " + jobName(j) });
      const fig = el("span", { class: "measured" }), hint = el("span", { class: "meta" });
      prog.append(bar, fig, hint);
      const cancel = el("button", { type: "button", text: "Cancel", "aria-label": "Cancel " + jobName(j),
        onclick: () => cancelJob(jobs.get(j.id) || j, cancel, (m) => msg.replaceChildren(el("span", { class: "errtext", role: "alert", text: m }))) });
      act.push(cancel);
      row.refs = { bar, fig, hint };
    } else if (j.state === "error") {
      prog.append(el("span", { class: "measured", text: fmtBytes(j.downloaded || 0) + (j.size ? " of " + fmtBytes(j.size) : "") }));
      msg.append(el("span", { class: "errtext", text: j.error || "unknown error" }));
    } else {
      prog.append(el("span", { class: "measured", text: fmtBytes(j.downloaded || 0) + (j.size ? " of " + fmtBytes(j.size) : "") }));
    }
    row.tr.replaceChildren(
      td("File", el("div", { class: "dl-name", text: jobName(j) }), el("div", { class: "meta measured", text: hostOf(j.url) })),
      td("State", el("span", { class: "state " + j.state, text: STATE_WORD[j.state] || j.state })),
      td("Progress", prog), td("Note", msg), td("", ...act));
  }
  if (row.refs) {
    setBar(row.refs.bar, j);
    const p = progressParts(j);
    row.refs.fig.textContent = p.figures; row.refs.hint.textContent = p.hint; row.refs.hint.hidden = !p.hint;
  }
  return row;
}
// A filesystem path that wraps only after a "/" (text nodes and <wbr>, no HTML strings).
function pathEl(cls, text) {
  const e = el("span", { class: cls, title: text });
  String(text).split("/").forEach((part, i, all) => { e.append(part + (i < all.length - 1 ? "/" : "")); if (i < all.length - 1) e.append(document.createElement("wbr")); });
  return e;
}
function hostOf(u) { try { return new URL(u).host || ""; } catch (e) { return ""; } }

function toast(j) {
  const name = j.title || (cards.get(j.proposal_id) && cards.get(j.proposal_id).p.report && cards.get(j.proposal_id).p.report.title) || j.url || "Download";
  const msg = j.state === "done" ? "Finished: " + name : j.state === "error" ? "Failed: " + name + (j.error ? " (" + j.error + ")" : "") : "Cancelled: " + name;
  const t = el("div", { class: "toast" }, el("div", {}, el("div", { text: msg }), j.state === "done" && j.path ? el("div", { class: "path", text: j.path }) : null));
  const x = el("button", { type: "button", text: "Dismiss", "aria-label": "Dismiss notification", onclick: () => t.remove() });
  t.append(x);
  toasts.append(t);
  setTimeout(() => t.remove(), j.state === "done" ? 12000 : 9000);
}

let earlier = null; // kept for openChat's reset

function applyProposal(p) {
  proposals.set(p.id, Object.assign({}, proposals.get(p.id), p));
  const c = cards.get(p.id);
  if (c) { c.p = Object.assign({}, c.p, p); renderFoot(c); return; }
  if (route === "chat" && p.chat_id && p.chat_id === currentChat) { const n = ensureCard(proposals.get(p.id)); renderFoot(n); }
}

function applyJob(j, fromEvent) {
  jobs.set(j.id, j);
  const c = cards.get(j.proposal_id);
  if (c) {
    if (c.p.status !== "approved" || c.p.job_id !== j.id) c.p = Object.assign({}, c.p, { status: "approved", job_id: j.id });
    renderFoot(c);
  }
  if (fromEvent && ["done", "error", "cancelled"].includes(j.state) && !toasted.has(j.id)) {
    toasted.add(j.id); toast(j);
  }
  updateCount(); renderActive();
}

// ---------- start, then live updates ----------
let es = null;
async function start() {
  try {
    const [cs, ps, js, its] = await Promise.all([api("GET", "/api/chats"), api("GET", "/api/proposals"), api("GET", "/api/jobs"), api("GET", "/api/library")]);
    cs.forEach((c) => chatsMap.set(c.id, c));
    ps.forEach((p) => proposals.set(p.id, p));
    js.forEach((j) => { jobs.set(j.id, j); if (["done", "error", "cancelled"].includes(j.state)) toasted.add(j.id); });
    its.forEach((it) => items.set(it.id, it));
    libState = "full";
  } catch (e) {
    if (e.status === 401) return; // the sign-in form is up
    libState = "error";
  }
  try { if (localStorage.getItem("mdm-signed-in")) $("signout").hidden = false; } catch (e) { /* ignore */ }
  currentChat = undefined; // force the route to (re)open its chat with the loaded proposals
  onRoute(); renderLibrary();
  connectEvents(); health();
}

function connectEvents() {
  if (es) es.close();
  let opened = false;
  es = new EventSource("/api/events");
  // Resync on every reopen so nothing that changed while the stream was down is missed.
  es.onopen = () => { if (opened) resync(); opened = true; };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
    if (ev.type === "proposal" && ev.proposal) applyProposal(ev.proposal);
    else if ((ev.type === "job" || ev.type === "job_done") && ev.job) applyJob(ev.job, true);
    else if (ev.type === "item" && ev.item) applyItem(ev.item);
  };
}
async function resync() {
  try {
    const [ps, js, its] = await Promise.all([api("GET", "/api/proposals"), api("GET", "/api/jobs"), api("GET", "/api/library")]);
    ps.forEach((p) => applyProposal(p));
    js.forEach((j) => applyJob(j, true));
    its.forEach((it) => items.set(it.id, it)); renderLibrary();
  } catch (e) { /* ignore */ }
}

// ---------- markdown for the agent's replies: DOM nodes only, never HTML strings ----------
// ponytail: the subset the model writes (paragraphs, headings, lists, tables, code, bold, italic, links); add more when it writes more
function mdInline(text) {
  const out = [], re = /(`[^`]+`)|(\*\*(?:[^*]|\*(?!\*))+\*\*)|(\*[^*\s][^*]*\*)|(\[[^\]]+\]\((https?:\/\/[^\s)]+)\))|(https?:\/\/[^\s<>()|]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    const t = m[0];
    if (m[1]) out.push(el("code", { text: t.slice(1, -1) }));
    else if (m[2]) out.push(el("strong", {}, mdInline(t.slice(2, -2))));
    else if (m[3]) out.push(el("em", {}, mdInline(t.slice(1, -1))));
    else if (m[4]) out.push(el("a", { href: m[5], target: "_blank", rel: "noopener noreferrer" }, mdInline(t.slice(1, t.indexOf("](")))));
    else out.push(el("a", { href: t, target: "_blank", rel: "noopener noreferrer", text: t }));
    last = m.index + t.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) { const code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out.push(el("pre", {}, el("code", { text: code.join("\n") }))); continue; }
    let h = /^(#{1,6})\s+(.*)$/.exec(l);
    if (h) { out.push(el(h[1].length <= 2 ? "h4" : "h5", {}, mdInline(h[2]))); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)) { out.push(el("hr")); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(el("div", { class: "md-table" }, el("table", {},
        el("thead", {}, el("tr", {}, head.map((c) => el("th", { scope: "col" }, mdInline(c))))),
        el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c) => el("td", {}, mdInline(c)))))))));
      continue;
    }
    const li = /^\s*([-*+]|\d+[.)])\s+/;
    if (li.test(l)) {
      const ordered = /^\s*\d/.test(l), list = el(ordered ? "ol" : "ul");
      while (i < lines.length && li.test(lines[i])) list.append(el("li", {}, mdInline(lines[i++].replace(li, ""))));
      out.push(list); continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|\s*\|)/.test(lines[i]) && !li.test(lines[i])) para.push(lines[i++].trim());
    if (!para.length) { out.push(el("p", {}, mdInline(lines[i++]))); continue; }
    const pe = el("p"); para.forEach((t, k) => { if (k) pe.append(el("br")); pe.append(...mdInline(t)); }); out.push(pe);
  }
  return out;
}

// ---------- chat ----------
// ---------- chat ----------
let busy = false;
function setBusy(b) {
  busy = b; input.disabled = b; sendBtn.disabled = b;
  if (b) sendBtn.setAttribute("aria-busy", "true"); else sendBtn.removeAttribute("aria-busy");
  if (!b) { input.focus(); }
}

function onChatEvent(ev) {
  switch (ev.type) {
    case "tool_step": { const s = stepText(ev); add(el("div", { class: "step" }, el("span", { text: s.base }), s.detail ? el("span", { class: "measured", text: s.detail }) : null)); break; }
    case "proposal": if (ev.proposal) { proposals.set(ev.proposal.id, ev.proposal); renderFoot(ensureCard(ev.proposal)); } break;
    case "text": add(el("div", { class: "msg bot md" }, md(String(ev.text || "")))); break;
    case "error": add(el("div", { class: "msg err", role: "alert", text: String(ev.message || "Something went wrong.") })); break;
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;
  if (!currentChat) {
    // the first message of a New download makes its chat; the URL follows without reopening it
    try {
      const c = await api("POST", "/api/chats");
      chatsMap.set(c.id, c); currentChat = c.id;
      history.replaceState(null, "", location.pathname + location.search + "#chat/" + enc(c.id));
    } catch (e) { if (e.status !== 401) onChatEvent({ type: "error", message: "Could not start a chat: " + e.message }); return; }
  }
  const cid = currentChat, chat = chatsMap.get(cid);
  if (chat && (!chat.title || chat.title === "New download")) chat.title = text.slice(0, 60);
  if (chat) { chat.updated = new Date().toISOString(); setHead(chat); renderChatList(); }
  input.value = ""; autosize();
  add(el("div", { class: "msg user", text }));
  setBusy(true); showTyping();
  let sawDone = false;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: cid, message: text }) });
    if (!r.ok) {
      let d = ""; try { const j = await r.json(); d = typeof j.detail === "string" ? j.detail : ""; } catch (e) { /* ignore */ }
      throw new Error(d || "Request failed (" + r.status + ")");
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of block.split("\n")) {
          if (!line.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
          if (ev.type === "done") sawDone = true;
          else if (ev.type === "proposal" && ev.proposal) { proposals.set(ev.proposal.id, ev.proposal); if (currentChat === cid) onChatEvent(ev); }
          else if (currentChat === cid) onChatEvent(ev); // the transcript is saved server-side either way
        }
      }
    }
    if (!sawDone && currentChat === cid) onChatEvent({ type: "error", message: "The connection ended before the reply finished." });
  } catch (e) {
    if (currentChat === cid) onChatEvent({ type: "error", message: e.message || "Could not reach the server." });
  } finally {
    hideTyping(); setBusy(false);
    api("GET", "/api/chats").then((cs) => { cs.forEach((c) => chatsMap.set(c.id, c)); renderChatList(); }).catch(() => {});
  }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
$("composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });

async function health() {
  try {
    const h = await api("GET", "/api/health");
    const miss = [];
    if (!h.groq_key) miss.push("GROQ_API_KEY is not set (chat will not work)");
    if (!h.firecrawl) miss.push("Firecrawl is not reachable: run scripts/firecrawl_local.sh up (web search will not work)");
    if (!h.mdm_cli) miss.push("MDM CLI not found (downloads will fail)");
    if (miss.length) { const b = $("banner"); b.textContent = "Setup needed: " + miss.join("; ") + "."; b.hidden = false; }
  } catch (e) { /* ignore */ }
}

renderLibrary();
start();
if (!location.hash) input.focus();
</script>
</body>
