<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Download Assistant</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5b6573; --border: #d6dae0;
  --accent: #2455d6; --accent-text: #ffffff; --user-bg: #2455d6; --user-text: #ffffff;
  --ok-bg: #dff3e4; --ok-text: #0d5324; --caution-bg: #fdf0c9; --caution-text: #6b4a00;
  --risky-bg: #fbdcdc; --risky-text: #8c1212; --err: #b3261e; --focus: #1a73e8; --shadow: 0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101317; --panel: #1a1f26; --text: #e8ebef; --muted: #9aa5b3; --border: #343b45;
    --accent: #6c93ff; --accent-text: #0b1020; --user-bg: #2f4fae; --user-text: #ffffff;
    --ok-bg: #123a20; --ok-text: #aee9c0; --caution-bg: #46350a; --caution-text: #ffe08a;
    --risky-bg: #4a1616; --risky-text: #ffb4b4; --err: #ff8a80; --focus: #8ab4f8; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { margin: 0; font-size: 1.05rem; }
header p { margin: 0; font-size: .8rem; color: var(--muted); }
#banner { margin: 0; padding: 8px 16px; background: var(--caution-bg); color: var(--caution-text); font-size: .9rem; }
#banner[hidden] { display: none; }
#thread { flex: 1; overflow-y: auto; padding: 16px; }
#inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow); }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.err { align-self: flex-start; background: var(--panel); border: 1px solid var(--err); color: var(--err); }
.chip { align-self: flex-start; font-size: .82rem; color: var(--muted); border: 1px dashed var(--border); border-radius: 999px; padding: 2px 11px; overflow-wrap: anywhere; max-width: 88%; }
.typing { align-self: flex-start; color: var(--muted); font-size: .85rem; }
.divider { align-self: stretch; text-align: center; color: var(--muted); font-size: .8rem; margin: 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 1.15rem; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 8px 14px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.danger { background: var(--risky-bg); color: var(--risky-text); border-color: var(--risky-text); font-weight: 600; }
button:disabled { opacity: .55; cursor: not-allowed; }
.card { align-self: stretch; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.card .body { display: flex; gap: 12px; padding: 12px; }
.card img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; flex: none; background: var(--bg); }
.card .info { min-width: 0; flex: 1; }
.card h3 { margin: 0 0 2px; font-size: 1rem; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.badge { display: inline-block; font-weight: 700; font-size: .82rem; padding: 2px 10px; border-radius: 999px; margin: 6px 0 2px; }
.badge.ok { background: var(--ok-bg); color: var(--ok-text); }
.badge.caution { background: var(--caution-bg); color: var(--caution-text); }
.badge.risky { background: var(--risky-bg); color: var(--risky-text); }
.card ul { margin: 4px 0; padding-left: 20px; font-size: .88rem; }
.card details { font-size: .88rem; margin-top: 6px; }
.card details ul { max-height: 140px; overflow-y: auto; }
.note { font-size: .88rem; margin: 6px 0 0; }
.fine { font-size: .78rem; color: var(--muted); margin: 6px 0 0; }
.foot { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot .grow { flex: 1 1 100%; }
.foot progress { width: 100%; height: 12px; }
.confirm { flex: 1 1 100%; background: var(--risky-bg); color: var(--risky-text); border-radius: 8px; padding: 10px; }
.confirm p { margin: 0 0 8px; font-weight: 600; }
.confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }
.errtext { color: var(--err); font-size: .88rem; flex: 1 1 100%; }
.path { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; overflow-wrap: anywhere; }
form { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
form .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; resize: none; max-height: 160px; min-height: 42px; }
textarea:disabled { opacity: .6; }
#toasts { position: fixed; right: 12px; left: 12px; bottom: 84px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; max-width: 420px; background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.3); display: flex; gap: 10px; align-items: flex-start; }
.toast button { min-height: 28px; padding: 0 8px; background: transparent; color: inherit; border-color: currentColor; }
.sr { position: absolute; left: -9999px; }
@media (max-width: 520px) {
  .card .body { flex-direction: column; }
  .card img { width: 100%; height: 150px; }
  .msg { max-width: 94%; }
}
@media (prefers-reduced-motion: no-preference) { .typing { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
<header>
  <h1>Download Assistant</h1>
  <p>Describe something or paste a link. You decide what gets downloaded.</p>
</header>
<p id="banner" role="status" hidden></p>
<main id="thread" tabindex="-1" aria-label="Conversation">
  <div id="inner" role="log" aria-live="polite" aria-relevant="additions"></div>
</main>
<form id="composer" autocomplete="off">
  <div class="row">
    <label for="input" class="sr">Message</label>
    <textarea id="input" rows="1" maxlength="4000" placeholder="Describe what you want, or paste a link" required></textarea>
    <button type="submit" class="primary" id="send">Send</button>
  </div>
</form>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
// All model/web-derived text goes through el()/textContent; there is no HTML string building anywhere.
const $ = (id) => document.getElementById(id);
const inner = $("inner"), thread = $("thread"), input = $("input"), sendBtn = $("send"), toasts = $("toasts");

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid); // strings become text nodes
  return e;
}

function sessionId() {
  try {
    let s = sessionStorage.getItem("dm-session");
    if (!s) { s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); sessionStorage.setItem("dm-session", s); }
    return s;
  } catch (e) { return window.__sid || (window.__sid = String(Math.random()).slice(2) + Date.now()); }
}
const SESSION = sessionId();

function fmtBytes(n) {
  if (n == null || isNaN(n)) return "unknown size";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n < 10 ? 2 : 1)) + " " + u[i];
}
const fmtSpeed = (s) => (s ? fmtBytes(s) + "/s" : "");

// ---------- thread ----------
let typing = null, emptyEl = null;
function add(node) {
  if (emptyEl) { emptyEl.remove(); emptyEl = null; }
  if (typing && typing.parentNode) inner.insertBefore(node, typing); else inner.append(node);
  node.scrollIntoView({ block: "end" });
  return node;
}
function showTyping() { typing = el("div", { class: "typing", text: "Working..." }); inner.append(typing); typing.scrollIntoView({ block: "end" }); }
function hideTyping() { if (typing) typing.remove(); typing = null; }

const STEP_LABEL = {
  research: "Researching", web_search: "Searching the web", web_scrape: "Reading a page", inspect_link: "Checking link",
  propose_download: "Preparing a preview", job_status: "Checking download status", list_jobs: "Listing downloads",
};
function stepText(ev) {
  const base = (STEP_LABEL[ev.name] || String(ev.name)) + "...";
  const a = ev.args || {};
  const detail = a.query || a.url || a.job_id || "";
  return detail ? base + " " + String(detail).slice(0, 120) : base;
}

function showEmpty() {
  const send = (t) => { input.value = t; sendMessage(); };
  emptyEl = el("div", { class: "empty" },
    el("h2", { text: "What would you like to download?" }),
    el("div", { text: "I search, check links for safety, and show you a preview. Nothing downloads until you press Download." }),
    el("div", { class: "examples" },
      el("button", { type: "button", text: "Find a public-domain copy of Nosferatu (1922)", onclick: () => send("Find a public-domain copy of Nosferatu (1922)") }),
      el("button", { type: "button", text: "Paste a link to inspect", onclick: () => { input.value = "Please inspect this link: "; input.focus(); autosize(); } })));
  inner.append(emptyEl);
}

// ---------- cards ----------
const cards = new Map();      // proposal id -> {p, root, foot, footKey, refs}
const jobs = new Map();       // job id -> job
const toasted = new Set();

const BADGE = { ok: ["Looks OK", "✓ "], caution: ["Caution", "! "], risky: ["Risky", "✕ "] };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch (e) { /* non-JSON */ }
  if (!r.ok) { const err = new Error((data && data.detail && typeof data.detail === "string" ? data.detail : "Request failed (" + r.status + ")")); err.status = r.status; throw err; }
  return data;
}

function buildCard(p) {
  const r = p.report || {}, s = r.safety || {}, level = BADGE[s.level] ? s.level : "caution";
  const title = r.title || r.filename || r.url || "Untitled";
  const info = el("div", { class: "info" },
    el("h3", { text: title }),
    el("div", { class: "meta", text: [r.host, r.filename && r.filename !== title ? r.filename : null].filter(Boolean).join(" · ") }),
    el("div", { class: "meta", text: [fmtBytes(r.size), r.content_type, r.kind === "magnet" ? "torrent" : null].filter(Boolean).join(" · ") }),
    el("div", { class: "meta path", text: r.url || "" }),
    el("span", { class: "badge " + level, text: BADGE[level][1] + BADGE[level][0]}));
  if (s.reasons && s.reasons.length) info.append(el("ul", { "aria-label": "Safety reasons" }, s.reasons.map((x) => el("li", { text: String(x) }))));
  if (s.skipped && s.skipped.length) info.append(el("div", { class: "meta", text: "Checks that could not run:" }), el("ul", { "aria-label": "Skipped checks" }, s.skipped.map((x) => el("li", { text: String(x) }))));
  if (p.note) info.append(el("p", { class: "note", text: p.note }));
  if (r.files && r.files.length) {
    const chosen = p.files && p.files.length ? new Set(p.files) : null;
    info.append(el("details", {}, el("summary", { text: "Files (" + (chosen ? chosen.size + " of " : "") + r.files.length + ")" }),
      el("ul", {}, r.files.map((f) => el("li", { text: (chosen ? (chosen.has(f.index) ? "✓ " : "– ") : "") + f.path + " (" + fmtBytes(f.size) + ")" })))));
  }
  info.append(el("p", { class: "fine", text: "Safety checks are heuristics, not a guarantee." }));
  const body = el("div", { class: "body" });
  if (typeof r.image === "string" && r.image.startsWith("https://")) {
    body.append(el("img", { src: r.image, alt: "", loading: "lazy", referrerpolicy: "no-referrer", onerror: (e) => e.target.remove() }));
  }
  body.append(info);
  return body;
}

function ensureCard(p, parent) {
  let c = cards.get(p.id);
  if (c) { c.p = p; return c; }
  const foot = el("div", { class: "foot" });
  const root = el("section", { class: "card", "aria-label": "Download preview: " + ((p.report && (p.report.title || p.report.filename)) || "item") }, buildCard(p), foot);
  c = { p, root, foot, footKey: null, refs: null };
  cards.set(p.id, c);
  if (parent) parent.append(root); else add(root);
  return c;
}

function jobFor(c) { return c.p.job_id ? jobs.get(c.p.job_id) : null; }

function renderFoot(c) {
  const p = c.p, job = jobFor(c);
  const key = p.status + ":" + (job ? job.state : "-");
  if (key === c.footKey) { if (job) updateProgress(c, job); return; }
  c.footKey = key; c.refs = null;
  const f = c.foot; f.replaceChildren();
  if (p.status === "pending") {
    const dl = el("button", { type: "button", class: "primary", text: "Download", onclick: () => onDownload(c, dl, skip) });
    const skip = el("button", { type: "button", text: "Skip", onclick: () => onSkip(c, dl, skip) });
    f.append(dl, skip);
  } else if (p.status === "rejected") {
    f.append(el("span", { class: "meta", text: "Skipped." }));
  } else if (!job) {
    f.append(el("span", { class: "meta", text: "Starting download..." }));
  } else if (job.state === "queued" || job.state === "running") {
    const bar = el("progress", { max: 100, "aria-label": "Download progress" });
    const txt = el("span", { class: "meta grow" });
    const cancel = el("button", { type: "button", text: "Cancel", onclick: async () => {
      cancel.disabled = true;
      try { applyJob(await api("POST", "/api/jobs/" + encodeURIComponent(job.id) + "/cancel")); } catch (e) { cancel.disabled = false; f.append(el("span", { class: "errtext", role: "alert", text: e.message })); }
    } });
    f.append(bar, txt, cancel);
    c.refs = { bar, txt };
    updateProgress(c, job);
  } else if (job.state === "done") {
    f.append(el("span", { class: "meta grow", text: "Download complete." }), el("span", { class: "path grow", text: "Saved to " + (job.path || "?") }));
  } else if (job.state === "error") {
    f.append(el("span", { class: "errtext", role: "alert", text: "Download failed: " + (job.error || "unknown error") }));
  } else {
    f.append(el("span", { class: "meta", text: "Download cancelled." }));
  }
}

function updateProgress(c, job) {
  if (!c.refs) return;
  const { bar, txt } = c.refs;
  if (job.size) { bar.max = job.size; bar.value = job.downloaded || 0; } else { bar.removeAttribute("value"); }
  const left = fmtBytes(job.downloaded || 0) + (job.size ? " of " + fmtBytes(job.size) : "");
  const parts = [(job.state === "queued" ? "Queued. " : "") + left];
  if (job.speed) parts.push(fmtSpeed(job.speed));
  const eta = etaText(job);
  if (eta) parts.push(eta);
  const torrent = job.peers != null || job.phase != null;
  const n = (k, one, many) => k + " " + (k === 1 ? one : many);
  if (torrent) parts.push(n(job.peers || 0, "peer", "peers") + " connected" + (job.peers_seen ? ", " + job.peers_seen + " found" : ""));
  else if (job.connections) parts.push(n(job.connections, "connection", "connections"));
  txt.textContent = parts.join(" · ") + slowHint(job, torrent);
}

// Time left from the current speed; hidden until both size and speed are known.
function etaText(job) {
  if (job.state !== "running" || !job.size || !job.speed) return "";
  const s = Math.max(0, (job.size - (job.downloaded || 0)) / job.speed);
  if (s < 60) return Math.ceil(s) + " s left";
  if (s < 3600) return Math.round(s / 60) + " min left";
  return Math.floor(s / 3600) + " h " + Math.round((s % 3600) / 60) + " min left";
}

// Why it is slow, in plain words, when MDM's numbers say so.
function slowHint(job, torrent) {
  if (job.state !== "running" || job.speed) return "";
  if (torrent) return job.peers ? ". Connected to peers, waiting for data." :
    ". Waiting for peers: few or no people are sharing this torrent right now, so it can't go faster.";
  return job.downloaded ? ". Stalled: the server stopped sending data (it may be limiting or blocking this connection)."
    : ". Connecting to the server...";
}

function footError(c, msg) {
  c.foot.querySelectorAll(".errtext").forEach((n) => n.remove());
  c.foot.append(el("span", { class: "errtext", role: "alert", text: msg }));
}

function onDownload(c, dl, skip) {
  if (c.p.report && c.p.report.safety && c.p.report.safety.level === "risky") return askRisky(c, dl, skip);
  return doApprove(c, false, dl, skip);
}

function askRisky(c, dl, skip) {
  if (c.foot.querySelector(".confirm")) return;
  dl.disabled = skip.disabled = true;
  const no = el("button", { type: "button", text: "Cancel" });
  const yes = el("button", { type: "button", class: "danger", text: "Yes, download anyway" });
  const box = el("div", { class: "confirm", role: "group", "aria-label": "Confirm risky download" },
    el("p", { text: "This looks risky. Download anyway?" }), el("div", { class: "row" }, no, yes));
  const close = () => { box.remove(); dl.disabled = skip.disabled = false; dl.focus(); };
  no.addEventListener("click", close);
  box.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  yes.addEventListener("click", () => { yes.disabled = no.disabled = true; doApprove(c, true, dl, skip, box); });
  c.foot.append(box);
  no.focus();
}

async function doApprove(c, confirmRisky, dl, skip, box) {
  dl.disabled = skip.disabled = true;
  try {
    const job = await api("POST", "/api/proposals/" + encodeURIComponent(c.p.id) + "/approve", { confirm_risky: confirmRisky });
    c.p = Object.assign({}, c.p, { status: "approved", job_id: job.id });
    applyJob(job);
  } catch (e) {
    if (box) box.remove();
    dl.disabled = skip.disabled = false;
    if (e.status === 409 && e.message === "needs_confirm") return askRisky(c, dl, skip);
    footError(c, e.message);
  }
}

async function onSkip(c, dl, skip) {
  dl.disabled = skip.disabled = true;
  try { applyProposal(await api("POST", "/api/proposals/" + encodeURIComponent(c.p.id) + "/reject")); }
  catch (e) { dl.disabled = skip.disabled = false; footError(c, e.message); }
}

// ---------- state sync ----------
let earlier = null;
function earlierBox() {
  if (!earlier) { earlier = el("div", { class: "earlier", style: "display:contents" }); inner.prepend(earlier); }
  return earlier;
}

function applyProposal(p, fromRestore) {
  let c = cards.get(p.id);
  if (!c) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    if (fromRestore) { const box = earlierBox(); c = ensureCard(p, box); }
    else c = ensureCard(p); // new proposal (chat or another tab)
  } else c.p = Object.assign({}, c.p, p);
  renderFoot(c);
}

function applyJob(j, fromEvent) {
  jobs.set(j.id, j);
  const c = cards.get(j.proposal_id);
  if (c) {
    if (c.p.status !== "approved" || c.p.job_id !== j.id) c.p = Object.assign({}, c.p, { status: "approved", job_id: j.id });
    renderFoot(c);
  }
  if (fromEvent && ["done", "error", "cancelled"].includes(j.state) && !toasted.has(j.id)) {
    toasted.add(j.id); toast(j);
  }
}

function toast(j) {
  const name = j.title || (cards.get(j.proposal_id) && cards.get(j.proposal_id).p.report && cards.get(j.proposal_id).p.report.title) || j.url || "Download";
  const msg = j.state === "done" ? "Finished: " + name : j.state === "error" ? "Failed: " + name + (j.error ? " (" + j.error + ")" : "") : "Cancelled: " + name;
  const t = el("div", { class: "toast" }, el("div", {}, el("div", { text: msg }), j.state === "done" && j.path ? el("div", { class: "path", text: j.path }) : null));
  const x = el("button", { type: "button", text: "Dismiss", "aria-label": "Dismiss notification", onclick: () => t.remove() });
  t.append(x);
  toasts.append(t);
  setTimeout(() => t.remove(), j.state === "done" ? 12000 : 9000);
}

let restored = false;
async function restore() {
  try {
    const [ps, js] = await Promise.all([api("GET", "/api/proposals"), api("GET", "/api/jobs")]);
    js.forEach((j) => { jobs.set(j.id, j); if (["done", "error", "cancelled"].includes(j.state)) toasted.add(j.id); });
    const sorted = ps.slice().sort((a, b) => String(a.created).localeCompare(String(b.created)));
    sorted.forEach((p) => applyProposal(p, true));
    if (sorted.length && earlier) earlier.prepend(el("div", { class: "divider", text: "Earlier previews and downloads" }));
    restored = true;
  } catch (e) { /* server not ready; events stream will resync */ }
  if (!cards.size && !inner.children.length) showEmpty();
}

function connectEvents() {
  const es = new EventSource("/api/events");
  // Resync on EVERY open (incl. the first) so nothing that changed before the stream attached is missed;
  // if the initial restore failed, retry it instead so earlier cards appear without toasting old jobs.
  es.onopen = () => { if (restored) resync(); else restore(); };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
    if (ev.type === "proposal" && ev.proposal) applyProposal(ev.proposal);
    else if ((ev.type === "job" || ev.type === "job_done") && ev.job) applyJob(ev.job, true);
  };
}
async function resync() {
  try {
    const [ps, js] = await Promise.all([api("GET", "/api/proposals"), api("GET", "/api/jobs")]);
    js.forEach((j) => applyJob(j, true));
    ps.forEach((p) => { if (cards.has(p.id)) applyProposal(p); });
  } catch (e) { /* ignore */ }
}

// ---------- chat ----------
let busy = false;
function setBusy(b) {
  busy = b; input.disabled = b; sendBtn.disabled = b;
  if (!b) { input.focus(); }
}

function onChatEvent(ev) {
  switch (ev.type) {
    case "tool_step": add(el("div", { class: "chip", text: stepText(ev) })); break;
    case "proposal": if (ev.proposal) applyProposal(ev.proposal); break;
    case "text": add(el("div", { class: "msg bot", text: String(ev.text || "") })); break;
    case "error": add(el("div", { class: "msg err", role: "alert", text: String(ev.message || "Something went wrong.") })); break;
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; autosize();
  add(el("div", { class: "msg user", text }));
  setBusy(true); showTyping();
  let sawDone = false;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: SESSION, message: text }) });
    if (!r.ok) {
      let d = ""; try { const j = await r.json(); d = typeof j.detail === "string" ? j.detail : ""; } catch (e) { /* ignore */ }
      throw new Error(d || "Request failed (" + r.status + ")");
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of block.split("\n")) {
          if (!line.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
          if (ev.type === "done") sawDone = true; else onChatEvent(ev);
        }
      }
    }
    if (!sawDone) onChatEvent({ type: "error", message: "The connection ended before the reply finished." });
  } catch (e) {
    onChatEvent({ type: "error", message: e.message || "Could not reach the server." });
  } finally {
    hideTyping(); setBusy(false);
  }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
$("composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });

// ---------- health banner ----------
async function health() {
  try {
    const h = await api("GET", "/api/health");
    const miss = [];
    if (!h.groq_key) miss.push("GROQ_API_KEY is not set (chat will not work)");
    if (!h.firecrawl) miss.push("Firecrawl is not reachable: run scripts/firecrawl_local.sh up (web search will not work)");
    if (!h.mdm_cli) miss.push("MDM CLI not found (downloads will fail)");
    if (miss.length) { const b = $("banner"); b.textContent = "Setup needed: " + miss.join("; ") + "."; b.hidden = false; }
  } catch (e) { /* ignore */ }
}

restore().then(connectEvents);
health();
input.focus();
</script>
